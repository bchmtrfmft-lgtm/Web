<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Esta línea arregla los problemas de tildes y caracteres raros (UTF-8) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Isla, Mi Reto | Lanzarote - Nairi y Anyara</title>
    <style>
        /* Paleta de colores: Gama de Azules Oceánicos y Marinos */
        :root {
            --azul-marino-profundo: #0A192F;
            --azul-marino-medio: #1E3A8A;
            --azul-oceano: #0284C7;
            --azul-costa: #38BDF8;
            --azul-hielo-fondo: #F0F7FF;
            --blanco: #FFFFFF;
            --texto-oscuro: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--azul-hielo-fondo);
            color: var(--texto-oscuro);
            line-height: 1.6;
        }

        /* Cabecera / Header */
        header {
            background: linear-gradient(135deg, var(--azul-marino-profundo) 0%, var(--azul-marino-medio) 100%);
            color: var(--blanco);
            text-align: center;
            padding: 3.5rem 1.5rem 2.5rem;
            border-bottom: 4px solid var(--azul-costa);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
            color: var(--blanco);
        }

        header .subtitulo {
            font-size: 1.1rem;
            color: var(--azul-costa);
            max-width: 750px;
            margin: 0 auto 1.5rem;
            font-weight: 300;
        }

        .creditos-alumnado {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--azul-costa);
            color: var(--azul-costa);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Contenedor Principal */
        main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Secciones y Tarjetas */
        section {
            background-color: var(--blanco);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 12px rgba(10, 25, 47, 0.05);
            border-left: 5px solid var(--azul-oceano);
        }

        h2 {
            color: var(--azul-marino-profundo);
            font-size: 1.5rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--azul-hielo-fondo);
            padding-bottom: 0.5rem;
        }

        p {
            margin-bottom: 1rem;
        }

        /* Gestión de Imágenes Locales */
        .imagen-contenedor {
            margin: 1.5rem 0;
            text-align: center;
        }

        .imagen-local {
            width: 100%;
            height: auto;
            max-height: 420px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .pie-imagen {
            font-size: 0.85rem;
            color: #64748B;
            margin-top: 0.4rem;
        }

        /* Listas y Pasos */
        .grid-pasos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
